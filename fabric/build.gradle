


plugins {
    id 'com.gradleup.shadow'
}

repositories {
    if (file("$rootDir/gradle/local-maven").exists()) { maven { url = file("$rootDir/gradle/local-maven") } }
}

configurations.all {
    resolutionStrategy.dependencySubstitution {
        // maven.architectury.dev stalls on large files on this network; the
        // architectury-plugin inserts that repo first, so reroute the common
        // artifact to a local mirror module (same -dev jar, plain coordinates)
        if (file("$rootDir/gradle/local-maven").exists()) substitute module('dev.architectury:architectury') using module('dev.architectury.local:architectury-common:1.0')
        if (file("$rootDir/gradle/local-maven").exists()) substitute module('dev.architectury:architectury-fabric') using module('dev.architectury.local:architectury-fabric:1.0')
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    implementation "net.fabricmc.fabric-api:fabric-data-generation-api-v1:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

loom {
    runs {
        datagen {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=colorful_redstone_lamps"
            runDir "build/datagen"
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

// no-remap loom has no remapJar; package the shadow jar (which bundles
// the common sourceset) as the release artifact instead
jar {
    archiveClassifier = "mc${rootProject.minecraft_version}-fabric"
    dependsOn shadowJar
    from zipTree(shadowJar.archiveFile)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
