


plugins {
    id 'com.gradleup.shadow'
}

repositories {
    if (file("$rootDir/gradle/local-maven").exists()) { maven { url = file("$rootDir/gradle/local-maven") } }
}

configurations.all {
    resolutionStrategy.dependencySubstitution {
        // maven.architectury.dev stalls on large files on this network; the
        // architectury-plugin inserts that repo first, so reroute the common
        // artifact to a local mirror module (same -dev jar, plain coordinates)
        if (file("$rootDir/gradle/local-maven").exists()) substitute module('dev.architectury:architectury') using module('dev.architectury.local:architectury-common:1.0')
        if (file("$rootDir/gradle/local-maven").exists()) substitute module('dev.architectury:architectury-neoforge') using module('dev.architectury.local:architectury-neoforge:1.0')
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}


repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

// no-remap loom has no remapJar; package the shadow jar (which bundles
// the common sourceset) as the release artifact instead
jar {
    archiveClassifier = "mc${rootProject.minecraft_version}-neoforge"
    dependsOn shadowJar
    from zipTree(shadowJar.archiveFile)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
